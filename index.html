<!doctype html>

<head>

<title>Nikolay Yanev</title>

<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --fg2: #444; --fg3: #777; --line: #e5e5e5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --fg2: #bbb; --fg3: #888; --line: #2a2a2a; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 96px 16px 40px; }
  h1 { margin: 0; font-size: 40px; font-weight: 500; line-height: 1.1; letter-spacing: -.03em; }
  h2 { margin: 40px 0 8px; font-size: 13px; font-weight: 500; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; }
  p { margin: 0 0 10px; color: var(--fg2); }
  .lead { margin-top: 10px; font-size: 18px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; text-decoration: none; }
  li a:hover span:first-child { text-decoration: underline; }
  li span:last-child { color: var(--fg3); }
  a { color: inherit; }
  footer { margin-top: 64px; color: var(--fg3); font-size: 13px; }
</style>
</head>

<main>

    </li>
  </ul>

  <p><a href="mailto:nikolay@yanev.co">nikolay@yanev.co</a></p>

  <footer>&copy; 2026 Nikolay Yanev</footer>
</main>
</body>
</html>
